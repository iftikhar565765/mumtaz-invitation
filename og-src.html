<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Marcellus&family=Pinyon+Script&family=Jost:wght@300;400&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:
      url("assets/art/marble-dusk.svg") center / cover,
      radial-gradient(120% 80% at 50% -10%, rgba(163,73,42,.34) 0%, transparent 58%),
      radial-gradient(90% 50% at 50% 115%, rgba(185,138,62,.2) 0%, transparent 66%),
      #261D14;
    position: relative;
  }
  .medal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:440px; opacity:.16; }
  .inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .shloka { font-family:'Tiro Devanagari Hindi',serif; color:rgba(201,168,92,.85); font-size:26px; letter-spacing:normal; margin-bottom:14px; }
  .eyebrow { font-family:'Jost',sans-serif; font-weight:300; color:rgba(239,232,216,.72); font-size:17px; letter-spacing:.34em; text-indent:.34em; text-transform:uppercase; margin-bottom:10px; }
  .names { font-family:'Pinyon Script',cursive; font-size:118px; line-height:1.05; color:#E9D3C0; text-shadow:0 4px 40px rgba(201,168,92,.35); }
  .rule { display:flex; align-items:center; gap:14px; margin:18px 0 14px; }
  .rule i { width:150px; height:1px; background:linear-gradient(90deg, transparent, rgba(201,168,92,.8)); }
  .rule i:last-child { background:linear-gradient(90deg, rgba(201,168,92,.8), transparent); }
  .rule svg { width:26px; height:26px; }
  .date { font-family:'Marcellus',serif; color:#C9A85C; font-size:32px; letter-spacing:.22em; }
  .venue { font-family:'Cormorant Garamond',serif; color:rgba(239,232,216,.66); font-size:20px; letter-spacing:.12em; margin-top:10px; }
  .plate { position:absolute; top:-5%; left:50%; transform:translateX(-50%); width:520px; height:200px;
    -webkit-mask-image:linear-gradient(180deg,#000 46%,transparent 92%); mask-image:linear-gradient(180deg,#000 46%,transparent 92%);
    opacity:.55; }
  .sprig-bl, .sprig-br { position:absolute; top:6px; width:clamp(150px, 17vw, 210px); height:auto; }
  .sprig-bl { left:-14px; transform:scaleY(-1) rotate(6deg); opacity:.85; }
  .sprig-br { right:-14px; transform:scaleY(-1) scaleX(-1) rotate(6deg); opacity:.85; }
</style>
</head>
<body>
<img class="medal" src="assets/art/rangoli-hero.png" alt="">
<img class="plate" src="assets/art/marble-dusk.svg" alt="">
<div class="inner">
  <p class="shloka">॥ शुभ विवाह ॥</p>
  <p class="eyebrow">With the blessings of our families</p>
  <p class="names">Arjun &amp; Meera</p>
  <div class="rule"><i></i><svg viewBox="0 0 22 22" fill="none" stroke="#C9A85C" stroke-width="1.3"><path d="M11 2 L14.5 11 L11 20 L7.5 11 Z"/></svg><i></i></div>
  <p class="date">06 · 11 · 2027</p>
  <p class="venue">The Gulshan Mahal · Agra</p>
</div>
<img class="sprig-bl" src="assets/art/roses-cluster.png" alt="">
<img class="sprig-br" src="assets/art/roses-cluster.png" alt="">
</body>
</html>
