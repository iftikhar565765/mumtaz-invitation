<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" aria-hidden="true" focusable="false">
  <!-- the pietra dura shamsa — octagonal jali ring, ring of inlay blossoms, ivory lotus heart -->
  <defs>
    <radialGradient id="marbleM" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#FBF7EC"/>
      <stop offset="72%" stop-color="#F2ECDC"/>
      <stop offset="100%" stop-color="#E3D9C2"/>
    </radialGradient>
    <radialGradient id="petC" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#B9633B"/><stop offset="100%" stop-color="#8A3B1E"/>
    </radialGradient>
    <radialGradient id="petJ" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#8FA37E"/><stop offset="100%" stop-color="#5A6D52"/>
    </radialGradient>
    <radialGradient id="petL" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#64809C"/><stop offset="100%" stop-color="#445C77"/>
    </radialGradient>
    <radialGradient id="petT" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#8FB0A8"/><stop offset="100%" stop-color="#5F847C"/>
    </radialGradient>
    <g id="mini-bloom">
      <g stroke-width="1" stroke="#4E6047">
        <path d="M 0 -5 C -10 -10 -15 -22 -8 -31 C -4 -36 4 -36 8 -31 C 15 -22 10 -10 0 -5 Z"/>
        <path d="M 0 -5 C -10 -10 -15 -22 -8 -31 C -4 -36 4 -36 8 -31 C 15 -22 10 -10 0 -5 Z" transform="rotate(72)"/>
        <path d="M 0 -5 C -10 -10 -15 -22 -8 -31 C -4 -36 4 -36 8 -31 C 15 -22 10 -10 0 -5 Z" transform="rotate(144)"/>
        <path d="M 0 -5 C -10 -10 -15 -22 -8 -31 C -4 -36 4 -36 8 -31 C 15 -22 10 -10 0 -5 Z" transform="rotate(216)"/>
        <path d="M 0 -5 C -10 -10 -15 -22 -8 -31 C -4 -36 4 -36 8 -31 C 15 -22 10 -10 0 -5 Z" transform="rotate(288)"/>
      </g>
      <circle r="3.4" fill="#A5823C"/>
    </g>
    <path id="jali-petal" d="M 0 -12 C -9 -18 -13 -30 -6 -40 C -2 -45 2 -45 6 -40 C 13 -30 9 -18 0 -12 Z"/>
  </defs>

  <!-- outer marble ring -->
  <circle cx="180" cy="180" r="172" fill="url(#marbleM)" stroke="#A5823C" stroke-width="1.6"/>
  <circle cx="180" cy="180" r="164" fill="none" stroke="#A5823C" stroke-width=".8" opacity=".65"/>
  <circle cx="180" cy="180" r="156" fill="none" stroke="#A5823C" stroke-width=".8" opacity=".45"/>

  <!-- the eight-point jali star -->
  <g fill="none" stroke="#A5823C" stroke-width="1" opacity=".75">
    <polygon points="180 26 187.8 87.7 221.7 37.5 201.7 96.5 250.5 62.2 216.4 111.3 274.4 90.9 225.3 124.5 284 132 225.3 139.5 274.4 173.1 216.4 148.9 250.5 197.9 201.7 163.5 221.7 222.5 187.8 172.3 180 234 172.2 172.3 138.3 222.5 158.3 163.5 109.5 197.9 143.6 148.9 85.6 173.1 134.7 139.5 76 132 134.7 124.5 85.6 90.9 143.6 111.3 109.5 62.2 158.3 96.5 138.3 37.5 172.2 87.7"/>
  </g>
  <g fill="none" stroke="#A5823C" stroke-width=".7" opacity=".5">
    <circle cx="180" cy="132" r="104"/>
    <circle cx="180" cy="180" r="132"/>
  </g>

  <!-- ring of inlay blossoms (eight, alternating stones) -->
  <g transform="translate(180 180)">
    <use href="#mini-bloom" fill="url(#petC)" transform="translate(0 -122)"/>
    <use href="#mini-bloom" fill="url(#petJ)" transform="translate(86 -86)"/>
    <use href="#mini-bloom" fill="url(#petL)" transform="translate(122 0)"/>
    <use href="#mini-bloom" fill="url(#petT)" transform="translate(86 86)"/>
    <use href="#mini-bloom" fill="url(#petC)" transform="translate(0 122)"/>
    <use href="#mini-bloom" fill="url(#petJ)" transform="translate(-86 86)"/>
    <use href="#mini-bloom" fill="url(#petL)" transform="translate(-122 0)"/>
    <use href="#mini-bloom" fill="url(#petT)" transform="translate(-86 -86)"/>
    <!-- gold beads between blossoms -->
    <g fill="#A5823C">
      <circle cx="61" cy="-61" r="2.2"/><circle cx="122" cy="-0" r="2.2"/><circle cx="61" cy="61" r="2.2"/><circle cx="0" cy="122" r="2.2"/>
      <circle cx="-61" cy="61" r="2.2"/><circle cx="-122" cy="0" r="2.2"/><circle cx="-61" cy="-61" r="2.2"/><circle cx="0" cy="-122" r="2.2"/>
    </g>
  </g>

  <!-- inner ivory medallion with the lotus heart -->
  <circle cx="180" cy="180" r="96" fill="url(#marbleM)" stroke="#A5823C" stroke-width="1.2"/>
  <circle cx="180" cy="180" r="88" fill="none" stroke="#A5823C" stroke-width=".7" opacity=".5"/>
  <g transform="translate(180 196)">
    <!-- lotus: carnelian centre flanked by jade, lapis outer sweep -->
    <g fill="url(#petC)" stroke="#6E2F16" stroke-width="1">
      <path d="M 0 6 C -14 -4 -18 -28 0 -46 C 18 -28 14 -4 0 6 Z"/>
      <path d="M 0 6 C -14 -4 -18 -28 0 -46 C 18 -28 14 -4 0 6 Z" transform="rotate(38) scale(.72)"/>
      <path d="M 0 6 C -14 -4 -18 -28 0 -46 C 18 -28 14 -4 0 6 Z" transform="rotate(-38) scale(.72)"/>
    </g>
    <g fill="url(#petJ)" stroke="#48573F" stroke-width="1">
      <path d="M -4 8 C -26 0 -36 -18 -30 -36 C -14 -30 -6 -14 -4 8 Z"/>
      <path d="M 4 8 C 26 0 36 -18 30 -36 C 14 -30 6 -14 4 8 Z"/>
    </g>
    <g fill="url(#petL)" stroke="#33475C" stroke-width=".9">
      <path d="M -8 10 C -32 8 -44 -4 -44 -20 C -28 -16 -16 -6 -8 10 Z"/>
      <path d="M 8 10 C 32 8 44 -4 44 -20 C 28 -16 16 -6 8 10 Z"/>
    </g>
    <g fill="url(#petT)" stroke="#4E6E66" stroke-width=".8">
      <path d="M -10 12 C -36 14 -52 6 -56 -8 C -38 -10 -22 0 -10 12 Z"/>
      <path d="M 10 12 C 36 14 52 6 56 -8 C 38 -10 22 0 10 12 Z"/>
    </g>
    <circle cy="18" r="4" fill="#A5823C"/>
  </g>
</svg>
