<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" aria-hidden="true" focusable="false">
  <!-- the lotus-petal garland — one gentle swag of ivory petals, gold beads and jade leaves -->
  <defs>
    <linearGradient id="glIvory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF4E6"/><stop offset="100%" stop-color="#EBDCC2"/>
    </linearGradient>
    <linearGradient id="glBlush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2DAC4"/><stop offset="100%" stop-color="#DEC3A4"/>
    </linearGradient>
    <linearGradient id="glLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E9273"/><stop offset="100%" stop-color="#5C6F55"/>
    </linearGradient>
    <path id="gl-petal" d="M 0 0 C -9 -7 -14 -20 -7 -34 C -3 -42 3 -42 7 -34 C 14 -20 9 -7 0 0 Z"/>
    <g id="gl-cluster">
      <path d="M 0 0 C -4 -7 -3 -14 2 -19 C 8 -14 9 -6 6 1 Z" fill="url(#glLeaf)" stroke="#4E6047" stroke-width=".8"/>
      <use href="#gl-petal" fill="url(#glIvory)" stroke="#D8C29A" stroke-width=".7"/>
      <use href="#gl-petal" fill="url(#glBlush)" stroke="#D8C29A" stroke-width=".7" transform="rotate(26) scale(.85)"/>
      <use href="#gl-petal" fill="url(#glIvory)" stroke="#D8C29A" stroke-width=".7" transform="rotate(-26) scale(.85)"/>
      <circle cy="-46" r="2.6" fill="#C9A85C"/>
    </g>
    <g id="gl-bead">
      <circle r="4.6" fill="#C9A85C"/>
      <circle r="2" fill="#F3E3BC"/>
    </g>
  </defs>
  <!-- the swag cord -->
  <path d="M 40 44 C 200 176 700 176 860 44" fill="none" stroke="#A5823C" stroke-width="1.6"/>
  <path d="M 40 52 C 202 182 698 182 860 52" fill="none" stroke="#A5823C" stroke-width=".8" opacity=".65"/>
  <!-- clusters riding the curve -->
  <use href="#gl-cluster" transform="translate(128 78) rotate(-14)"/>
  <use href="#gl-cluster" transform="translate(262 122) rotate(-7) scale(.94)"/>
  <use href="#gl-cluster" transform="translate(450 138) scale(1.04)"/>
  <use href="#gl-cluster" transform="translate(638 122) rotate(7) scale(.94)"/>
  <use href="#gl-cluster" transform="translate(772 78) rotate(14)"/>
  <!-- beads between clusters -->
  <use href="#gl-bead" transform="translate(196 102)"/>
  <use href="#gl-bead" transform="translate(356 136)"/>
  <use href="#gl-bead" transform="translate(544 136)"/>
  <use href="#gl-bead" transform="translate(704 102)"/>
  <!-- hanging drop: bead + small petal at the nadir -->
  <g transform="translate(450 148)">
    <path d="M 0 0 L 0 16" stroke="#A5823C" stroke-width="1"/>
    <use href="#gl-bead" transform="translate(0 20)"/>
    <use href="#gl-petal" fill="url(#glBlush)" transform="translate(0 52) scale(.9)"/>
    <circle cy="78" r="2.2" fill="#C9A85C"/>
  </g>
  <!-- corner stops -->
  <circle cx="40" cy="44" r="3.4" fill="#C9A85C"/>
  <circle cx="860" cy="44" r="3.4" fill="#C9A85C"/>
</svg>
