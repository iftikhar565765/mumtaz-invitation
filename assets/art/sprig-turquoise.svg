<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" aria-hidden="true" focusable="false">
  <!-- pietra dura turquoise bud band — a gentle horizontal sprig for ornament strips -->
  <defs>
    <radialGradient id="budT" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#8FB0A8"/>
      <stop offset="100%" stop-color="#5F847C"/>
    </radialGradient>
    <linearGradient id="leafT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E9273"/>
      <stop offset="100%" stop-color="#5C6F55"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#5C6F55" stroke-width="2" stroke-linecap="round">
    <path d="M 60 130 C 170 178 390 178 500 130"/>
    <path d="M 150 158 C 196 172 236 178 280 179 M 280 179 C 324 178 364 172 410 158" stroke-width="1.4"/>
  </g>
  <!-- central turquoise blossom -->
  <g transform="translate(280 108)">
    <g fill="url(#budT)" stroke="#4E6E66" stroke-width="1">
      <path d="M 0 -7 C -14 -14 -21 -31 -12 -43 C -6 -51 6 -51 12 -43 C 21 -31 14 -14 0 -7 Z"/>
      <path d="M 0 -7 C -14 -14 -21 -31 -12 -43 C -6 -51 6 -51 12 -43 C 21 -31 14 -14 0 -7 Z" transform="rotate(60)"/>
      <path d="M 0 -7 C -14 -14 -21 -31 -12 -43 C -6 -51 6 -51 12 -43 C 21 -31 14 -14 0 -7 Z" transform="rotate(120)"/>
      <path d="M 0 -7 C -14 -14 -21 -31 -12 -43 C -6 -51 6 -51 12 -43 C 21 -31 14 -14 0 -7 Z" transform="rotate(180)"/>
      <path d="M 0 -7 C -14 -14 -21 -31 -12 -43 C -6 -51 6 -51 12 -43 C 21 -31 14 -14 0 -7 Z" transform="rotate(240)"/>
      <path d="M 0 -7 C -14 -14 -21 -31 -12 -43 C -6 -51 6 -51 12 -43 C 21 -31 14 -14 0 -7 Z" transform="rotate(300)"/>
    </g>
    <circle r="5" fill="#5F847C" stroke="#C9A85C" stroke-width="1"/>
    <circle r="1.8" fill="#C9A85C"/>
  </g>
  <!-- side buds with leaves -->
  <g transform="translate(150 146) rotate(-14) scale(.62)">
    <path d="M 0 12 C -9 4 -10 -10 0 -24 C 10 -10 9 4 0 12 Z" fill="url(#budT)" stroke="#4E6E66" stroke-width="1.4"/>
    <path d="M 0 0 C 10 -8 24 -10 36 -4 C 24 6 10 8 0 0 Z" fill="url(#leafT)" stroke="#4E6047" stroke-width="1.2"/>
  </g>
  <g transform="translate(410 146) rotate(14) scale(.62)">
    <path d="M 0 12 C -9 4 -10 -10 0 -24 C 10 -10 9 4 0 12 Z" fill="url(#budT)" stroke="#4E6E66" stroke-width="1.4"/>
    <path d="M 0 0 C -10 -8 -24 -10 -36 -4 C -24 6 -10 8 0 0 Z" fill="url(#leafT)" stroke="#4E6047" stroke-width="1.2"/>
  </g>
  <!-- small leaves riding the stem -->
  <path d="M 96 136 C 110 128 126 126 140 130 C 128 140 112 142 96 136 Z" fill="url(#leafT)" stroke="#4E6047" stroke-width="1"/>
  <path d="M 464 136 C 450 128 434 126 420 130 C 432 140 448 142 464 136 Z" fill="url(#leafT)" stroke="#4E6047" stroke-width="1"/>
  <!-- gold stops -->
  <g fill="#A5823C">
    <circle cx="60" cy="130" r="3"/>
    <circle cx="500" cy="130" r="3"/>
    <circle cx="205" cy="172" r="2.4"/>
    <circle cx="355" cy="172" r="2.4"/>
  </g>
  <g fill="none" stroke="#A5823C" stroke-width="1">
    <circle cx="60" cy="130" r="6.4" opacity=".8"/>
    <circle cx="500" cy="130" r="6.4" opacity=".8"/>
  </g>
</svg>
