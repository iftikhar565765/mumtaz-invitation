<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" aria-hidden="true" focusable="false">
  <!-- umber marble at dusk — deep espresso ground, bronze veining, candle warmth -->
  <defs>
    <linearGradient id="md-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332619"/>
      <stop offset="42%" stop-color="#2C2016"/>
      <stop offset="100%" stop-color="#221810"/>
    </linearGradient>
    <filter id="md-vein" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.016" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="md-cloud">
      <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0055" numOctaves="4" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.83  0 0 0 0 0.62  0 0 0 0 0.38  0 0 0 0.05 0"/>
    </filter>
    <filter id="md-blur"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>
  <rect width="1440" height="720" fill="url(#md-base)"/>
  <rect width="1440" height="720" filter="url(#md-cloud)"/>
  <g filter="url(#md-vein)" opacity=".6">
    <g fill="none" stroke="#6E5230" filter="url(#md-blur)">
      <path d="M -60 170 C 260 148 440 210 780 178 C 1040 154 1260 200 1500 172" stroke-width="1.7" opacity=".55"/>
      <path d="M -60 450 C 240 476 480 420 800 448 C 1080 470 1300 428 1500 456" stroke-width="1.2" opacity=".5"/>
      <path d="M -60 640 C 300 610 540 668 920 632 C 1200 606 1340 656 1500 628" stroke-width=".9" opacity=".45"/>
      <path d="M -60 176 C 260 156 440 216 780 186 C 1040 162 1260 206 1500 180" stroke-width=".6" opacity=".6"/>
      <path d="M -60 458 C 240 482 480 428 800 454 C 1080 476 1300 434 1500 462" stroke-width=".5" opacity=".5"/>
    </g>
  </g>
  <!-- candle glow low in the frame -->
  <radialGradient id="md-glow" cx="50%" cy="96%" r="90%">
    <stop offset="0%" stop-color="#C98A4B" stop-opacity=".22"/>
    <stop offset="46%" stop-color="#C98A4B" stop-opacity=".07"/>
    <stop offset="100%" stop-color="#C98A4B" stop-opacity="0"/>
  </radialGradient>
  <rect width="1440" height="720" fill="url(#md-glow)"/>
</svg>
