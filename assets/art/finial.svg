<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 320" aria-hidden="true" focusable="false">
  <!-- the gilded finial mark — lotus bud cradled by a crescent -->
  <defs>
    <linearGradient id="goldF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9BC85"/>
      <stop offset="55%" stop-color="#B98A3E"/>
      <stop offset="100%" stop-color="#8E6524"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#B98A3E" stroke-width="1.6" stroke-linecap="round">
    <!-- rising stem -->
    <path d="M 70 312 C 66 286 66 260 70 234"/>
    <!-- crescent cradle -->
    <path d="M 40 214 C 42 238 56 252 70 252 C 84 252 98 238 100 214 C 106 246 90 268 70 268 C 50 268 34 246 40 214 Z" fill="url(#goldF)" stroke="#8E6524" stroke-width="1"/>
    <!-- lotus bud -->
    <path d="M 70 232 C 52 214 50 186 70 162 C 90 186 88 214 70 232 Z" fill="url(#goldF)" stroke="#8E6524" stroke-width="1"/>
    <path d="M 70 232 C 58 220 52 202 56 184 C 66 198 70 214 70 232 Z" fill="none" stroke="#8E6524" stroke-width=".9" opacity=".75"/>
    <path d="M 70 232 C 82 220 88 202 84 184 C 74 198 70 214 70 232 Z" fill="none" stroke="#8E6524" stroke-width=".9" opacity=".75"/>
    <!-- the lotus-tipped crown -->
    <path d="M 70 162 C 64 154 64 146 70 140 C 76 146 76 154 70 162 Z" fill="url(#goldF)" stroke="#8E6524" stroke-width=".9"/>
    <path d="M 70 140 C 68 132 68 126 70 120" stroke-width="1.1"/>
  </g>
  <!-- the star stop -->
  <g fill="#C9A85C">
    <path d="M 70 106 L 72.6 113.4 L 80 116 L 72.6 118.6 L 70 126 L 67.4 118.6 L 60 116 L 67.4 113.4 Z"/>
    <circle cx="70" cy="116" r="1.6" fill="#F3E3BC"/>
  </g>
  <!-- flanking beads -->
  <circle cx="52" cy="196" r="1.8" fill="#C9A85C"/>
  <circle cx="88" cy="196" r="1.8" fill="#C9A85C"/>
</svg>
