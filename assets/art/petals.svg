<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" aria-hidden="true" focusable="false">
  <!-- ivory & blush petal scatter — soft matte, edges only, centre clear -->
  <defs>
    <linearGradient id="ptIvory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF3E4"/><stop offset="100%" stop-color="#EBDCC2"/>
    </linearGradient>
    <linearGradient id="ptBlush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2DAC4"/><stop offset="100%" stop-color="#DEC3A4"/>
    </linearGradient>
    <linearGradient id="ptGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D0A0"/><stop offset="100%" stop-color="#CBB17C"/>
    </linearGradient>
    <filter id="ptSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation=".7"/>
    </filter>
    <path id="petal" d="M 0 0 C -14 -10 -22 -30 -12 -52 C -6 -64 6 -64 12 -52 C 22 -30 14 -10 0 0 Z"/>
  </defs>
  <g filter="url(#ptSoft)">
    <!-- top edge -->
    <use href="#petal" fill="url(#ptIvory)" transform="translate(120 96) rotate(-38)"/>
    <use href="#petal" fill="url(#ptBlush)" transform="translate(288 54) rotate(14) scale(.82)"/>
    <use href="#petal" fill="url(#ptIvory)" transform="translate(452 88) rotate(-12) scale(.94)"/>
    <use href="#petal" fill="url(#ptGold)"  transform="translate(622 50) rotate(30) scale(.7)"/>
    <use href="#petal" fill="url(#ptIvory)" transform="translate(776 102) rotate(58) scale(.86)"/>
    <use href="#petal" fill="url(#ptBlush)" transform="translate(856 190) rotate(84) scale(.66)"/>
    <!-- side petals -->
    <use href="#petal" fill="url(#ptIvory)" transform="translate(52 236) rotate(-76) scale(.9)"/>
    <use href="#petal" fill="url(#ptGold)"  transform="translate(846 336) rotate(104) scale(.8)"/>
    <use href="#petal" fill="url(#ptIvory)" transform="translate(60 420) rotate(-118) scale(.72)"/>
    <use href="#petal" fill="url(#ptBlush)" transform="translate(850 462) rotate(132) scale(.88)"/>
    <!-- bottom edge -->
    <use href="#petal" fill="url(#ptIvory)" transform="translate(170 548) rotate(168) scale(.9)"/>
    <use href="#petal" fill="url(#ptGold)"  transform="translate(330 570) rotate(148) scale(.68)"/>
    <use href="#petal" fill="url(#ptIvory)" transform="translate(498 548) rotate(190) scale(.9)"/>
    <use href="#petal" fill="url(#ptBlush)" transform="translate(668 568) rotate(206) scale(.76)"/>
    <use href="#petal" fill="url(#ptIvory)" transform="translate(812 542) rotate(226) scale(.84)"/>
    <!-- a few tiny loose petals inside the frame -->
    <use href="#petal" fill="url(#ptIvory)" transform="translate(204 208) rotate(-24) scale(.5)"/>
    <use href="#petal" fill="url(#ptBlush)" transform="translate(714 240) rotate(44) scale(.46)"/>
    <use href="#petal" fill="url(#ptIvory)" transform="translate(508 480) rotate(160) scale(.52)"/>
    <use href="#petal" fill="url(#ptGold)"  transform="translate(386 300) rotate(78) scale(.4)"/>
  </g>
  <!-- fine veining on the larger petals -->
  <g fill="none" stroke="#D8C29A" stroke-width=".7" opacity=".55">
    <path d="M 108 82 C 118 62 126 50 136 42" transform="rotate(-2 120 96)"/>
    <path d="M 446 74 C 452 62 458 52 466 46"/>
    <path d="M 164 536 C 172 524 180 514 188 508"/>
  </g>
</svg>
